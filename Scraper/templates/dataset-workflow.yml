name: Shared dataset
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest utils.test_build_dataset Scraper.test_preflight utils.test_dataset_pr Scraper.test_aside_runner
      - run: python utils/build_dataset.py --check
